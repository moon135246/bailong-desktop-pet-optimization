name: Build Windows and optional macOS
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish
        required: true
        default: v0.5.1-local.2
      artifact_run_id:
        description: Reuse artifacts from a completed run; leave empty to build
        default: ''
      build_macos:
        description: Build macOS arm64
        type: boolean
        default: false
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    if: ${{ !inputs.artifact_run_id }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare repaired assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python work/fetch_release_assets.py
      - name: Build complete Windows package
        shell: pwsh
        run: ./build-windows.ps1 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist-windows/*.zip
          if-no-files-found: error
  macos:
    if: ${{ inputs.build_macos && !inputs.artifact_run_id }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Prepare repaired assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python work/fetch_release_assets.py
      - name: Build decoder and application
        run: |
          test "$(uname -m)" = arm64
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          python -m pip install -r requirements-build.txt -r requirements-macos.txt
          python work/build_minimal_ffmpeg.py
          python work/build_macos.py --ffmpeg .build/ffmpeg/darwin-arm64/bin/ffmpeg
          python work/archive_platform.py --platform macos --directory dist-macos/BailongPet.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist-macos/*.zip
  publish:
    needs: [windows, macos]
    if: ${{ always() && !cancelled() && (inputs.artifact_run_id != '' || needs.windows.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        if: ${{ needs.windows.result == 'success' || inputs.artifact_run_id != '' }}
        with:
          name: windows-x86_64
          path: packages
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - uses: actions/download-artifact@v4
        if: ${{ needs.macos.result == 'success' || (inputs.artifact_run_id != '' && inputs.build_macos) }}
        with:
          name: macos-arm64
          path: packages
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Publish complete packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p .build
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG · Desktop build" --notes '构建产物正在上传。'
          fi
          mapfile -d '' package_files < <(find packages -type f \( -name "bailong-desktop-pet-${RELEASE_TAG}-windows-x86_64.zip" -o -name "bailong-desktop-pet-${RELEASE_TAG}-macos-arm64.zip" \) -print0)
          gh release upload "$RELEASE_TAG" "${package_files[@]}" --clobber
          gh release view "$RELEASE_TAG" --json assets > .build/release-assets.json
          python - <<'PYNOTES'
          import json, os
          from pathlib import Path
          tag, repo = os.environ['RELEASE_TAG'], os.environ['GH_REPO']
          assets = {a['name']: a['url'] for a in json.loads(Path('.build/release-assets.json').read_text())['assets']}
          rows = []
          for platform, suffix in [('Windows x86_64', 'windows-x86_64'), ('macOS Apple Silicon arm64', 'macos-arm64')]:
              name = f'bailong-desktop-pet-{tag}-{suffix}.zip'
              if name in assets:
                  rows.append(f'| {platform} | [下载 ZIP]({assets[name]}) |')
          text = Path('work/platform_release_notes.md').read_text(encoding='utf-8')
          text = text.replace('{{TAG}}', tag).replace('{{REPO}}', repo).replace('{{DOWNLOAD_ROWS}}', '\n'.join(rows))
          Path('.build/release-notes.md').write_text(text, encoding='utf-8')
          PYNOTES
          gh release edit "$RELEASE_TAG" --notes-file .build/release-notes.md --latest
